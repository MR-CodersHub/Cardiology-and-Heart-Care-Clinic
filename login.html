<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF9F6">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<meta name="description" content="Sign in to your Cardia Heart &amp; Vascular Care patient portal account.">
<title>Sign In | Cardia Heart &amp; Vascular Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
<main class="auth-page" id="main">
  <section class="auth-card" aria-labelledby="loginHeading">
    <div class="auth-brand">
      <a href="index.html" class="logo" aria-label="Cardia Heart &amp; Vascular Care — Home">
        <span class="logo__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l7.8-7.6 1.1-1.1a5.5 5.5 0 0 0-.1-7.7z"/>
            <path d="M3 12h4l2-4 3 8 2-4h4"/>
          </svg>
        </span>
        <span class="logo__text">
          <span class="logo__name">Cardia</span>
          <span class="logo__sub">Heart &amp; Vascular Care</span>
        </span>
      </a>
    </div>

    <div class="auth-head">
      <h1 class="auth-title" id="loginHeading">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue to your Cardia account.</p>
    </div>

    <form class="auth-form-body" id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input
          class="form-control"
          type="email"
          id="loginEmail"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          data-validate="email"
          aria-describedby="loginEmailError"
          required
        >
        <span class="form-error" id="loginEmailError" role="alert">Please enter a valid email address.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPass">Password</label>
        <div class="auth-password">
          <input
            class="form-control"
            type="password"
            id="loginPass"
            name="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            data-validate="text"
            aria-describedby="loginPassError"
            required
          >
          <button
            type="button"
            class="auth-pass-toggle"
            data-toggle-password="loginPass"
            aria-label="Show password"
            aria-pressed="false"
          >
            <svg class="ico-eye" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="ico-eye-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="form-error" id="loginPassError" role="alert">Please enter your password.</span>
      </div>

      <div class="auth-options">
        <label class="auth-check" for="rememberMe">
          <input type="checkbox" id="rememberMe" name="remember">
          <span>Remember me</span>
        </label>
        <a class="auth-link" href="#forgot-password" data-forgot-password>Forgot password?</a>
      </div>

      <button class="auth-submit" type="submit">Sign In</button>
    </form>

    <div class="auth-sep" role="separator">or continue with</div>

    <div class="auth-social-grid">
      <button type="button" class="auth-social-btn" data-social-auth="Google">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.44a5.51 5.51 0 0 1-2.39 3.61v3h3.87c2.26-2.08 3.57-5.15 3.57-8.64z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.94-2.91l-3.87-3a7.17 7.17 0 0 1-10.67-3.77H1.41v3.09A12 12 0 0 0 12 24z"/>
          <path fill="#FBBC05" d="M5.4 14.32A7.22 7.22 0 0 1 5.02 12c0-.81.14-1.59.38-2.32V6.59H1.41A12 12 0 0 0 0 12c0 1.94.46 3.77 1.41 5.41l3.99-3.09z"/>
          <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.58 1.79l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.41 6.59l3.99 3.09A7.16 7.16 0 0 1 12 4.75z"/>
        </svg>
        <span>Google</span>
      </button>
      <button type="button" class="auth-social-btn" data-social-auth="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#1877F2" d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07c0 6.02 4.39 11.01 10.13 11.93v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.08 24 18.09 24 12.07z"/>
        </svg>
        <span>Facebook</span>
      </button>
    </div>

    <p class="auth-switch">Don't have an account?<a class="auth-link" href="signup.html">Sign Up</a></p>
  </section>
</main>
<div class="toast-wrap" aria-live="polite"></div>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
